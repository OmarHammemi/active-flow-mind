# Nginx Configuration with WebSocket Support for Vite Dev Server
# This allows HTTPS page to connect to HTTP WebSocket through Nginx proxy

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name falah.live www.falah.live;
    return 301 https://$host$request_uri;
}

# HTTPS server block with WebSocket proxy
server {
    listen 443 ssl http2;
    server_name falah.live www.falah.live;
    
    # SSL Certificate
    ssl_certificate /etc/letsencrypt/live/falah.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/falah.live/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # Security Headers (set via HTTP headers, not meta tags)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # WebSocket and Vite HMR proxy
    location / {
        proxy_pass http://localhost:3006;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }
    
    # Logging
    access_log /var/log/nginx/falah.live.access.log;
    error_log /var/log/nginx/falah.live.error.log;
}
