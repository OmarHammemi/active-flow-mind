# Apache Configuration for SNI (Server Name Indication)
# This ensures the correct SSL certificate is served for each domain

# Enable NameVirtualHost for port 443 (required for SNI)
NameVirtualHost *:443

# HTTP to HTTPS redirect for falah.live
<VirtualHost *:80>
    ServerName falah.live
    ServerAlias www.falah.live
    Redirect permanent / https://falah.live/
</VirtualHost>

# HTTPS VirtualHost for falah.live (with SNI)
<VirtualHost *:443>
    ServerName falah.live
    ServerAlias www.falah.live
    
    # SSL Certificate for falah.live (must include falah.live in SAN)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/falah.live/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/falah.live/privkey.pem
    
    # SSL Configuration
    SSLProtocol all -SSLv2 -SSLv3
    SSLCipherSuite HIGH:!aNULL:!MD5
    
    # SNI is enabled by default in modern Apache
    # Each VirtualHost with different ServerName will use SNI automatically
    
    # Your app configuration
    ProxyPreserveHost On
    ProxyPass / http://localhost:3006/
    ProxyPassReverse / http://localhost:3006/
</VirtualHost>

# HTTPS VirtualHost for agenthub.digital (separate SNI block)
<VirtualHost *:443>
    ServerName agenthub.digital
    ServerAlias www.agenthub.digital
    
    # SSL Certificate for agenthub.digital
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/agenthub.digital/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/agenthub.digital/privkey.pem
    
    # SSL Configuration
    SSLProtocol all -SSLv2 -SSLv3
    SSLCipherSuite HIGH:!aNULL:!MD5
    
    # Your app configuration for agenthub.digital
    ProxyPreserveHost On
    ProxyPass / http://localhost:3006/
    ProxyPassReverse / http://localhost:3006/
</VirtualHost>

# OR: If you want ONE certificate for BOTH domains
# First, get certificate with both domains:
# sudo certbot --apache -d agenthub.digital -d falah.live
#
# Then use this configuration:
#
# <VirtualHost *:443>
#     ServerName agenthub.digital
#     ServerAlias www.agenthub.digital falah.live www.falah.live
