# Nginx Configuration for SNI (Server Name Indication)
# This ensures the correct SSL certificate is served for each domain

# HTTP to HTTPS redirect for falah.live
server {
    listen 80;
    server_name falah.live www.falah.live;
    return 301 https://$host$request_uri;
}

# HTTPS server block for falah.live (with SNI)
server {
    listen 443 ssl http2;
    server_name falah.live www.falah.live;
    
    # SSL Certificate for falah.live (must include falah.live in SAN)
    ssl_certificate /etc/letsencrypt/live/falah.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/falah.live/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # SNI is enabled by default in modern Nginx
    # Each server block with different server_name will use SNI automatically
    
    # Your app configuration
    location / {
        proxy_pass http://localhost:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS server block for agenthub.digital (separate SNI block)
server {
    listen 443 ssl http2;
    server_name agenthub.digital www.agenthub.digital;
    
    # SSL Certificate for agenthub.digital
    ssl_certificate /etc/letsencrypt/live/agenthub.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenthub.digital/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Your app configuration for agenthub.digital
    location / {
        proxy_pass http://localhost:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

